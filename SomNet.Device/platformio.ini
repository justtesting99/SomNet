; SomNet.Device — ESP32 firmware (PlatformIO)
; See README.md and docs/PROTOCOL.md

[platformio]
default_envs = dev
extra_configs = secrets.ini

[env:dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D FIRMWARE_VERSION=\"0.2.0-phase2\"
    -D WIFI_SSID=\"${secrets.wifi_ssid}\"
    -D WIFI_PASSWORD=\"${secrets.wifi_password}\"
    -D SOMNET_SERVER_HOST=\"${secrets.somnet_server_host}\"
    -D SOMNET_SERVER_PORT=${secrets.somnet_server_port}

; Phase 7+: enable wss profile
; [env:prod_cloud]
; extends = env:dev
; build_flags =
;     ${env:dev.build_flags}
;     -D SOMNET_USE_WSS=1
