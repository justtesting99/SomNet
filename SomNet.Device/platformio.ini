; SomNet.Device — ESP32 firmware (PlatformIO)
; See README.md and docs/PROTOCOL.md

[platformio]
default_envs = dev
extra_configs = secrets.ini

[env:dev]
platform = espressif32
board = esp32dev
framework = arduino
; Dual OTA slots ~1.9 MB each (SPIFFS minimal — we use PROGMEM for HTML). See README §Flash / partitions.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=12288
    -D FIRMWARE_VERSION=\"0.15.0-session-accessory\"
    -D WIFI_SSID=\"${secrets.wifi_ssid}\"
    -D WIFI_PASSWORD=\"${secrets.wifi_password}\"
    -D SOMNET_SERVER_HOST=\"${secrets.somnet_server_host}\"
    -D SOMNET_SERVER_PORT=${secrets.somnet_server_port}
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.5
    links2004/WebSockets @ ^2.4.2
    bblanchon/ArduinoJson @ ^7.2.0

; Phase 7: wss/TLS profile for cloud deployment (compile-only until Azure E2E)
[env:prod_cloud]
extends = env:dev
build_flags =
    ${env:dev.build_flags}
    -D SOMNET_USE_WSS=1

; SomEsp fork — standalone trial (Wi-Fi + LAN config only; no SignalR hub). See Documents/27-SomEsp-Standalone-Device-Plan.md
[env:somesp]
extends = env:dev
board_build.filesystem = littlefs
; Drop dev hub version string so somesp can set its own (avoid -U — breaks Xtensa gcc on Windows).
build_unflags =
    -D FIRMWARE_VERSION=\"0.15.0-session-accessory\"
build_flags =
    ${env:dev.build_flags}
    -D SOMNET_STANDALONE=1
    -D FIRMWARE_VERSION=\"somesp-0.3.6-ui-persist\"
